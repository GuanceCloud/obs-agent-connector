name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.ref_name }}

  windows-claude-desktop-smoke:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify Claude Desktop Windows installer fixtures
        run: go test ./internal/install -run '^(TestManagedWindows|TestPinManagedWindowsExecutable)' -count=1 -v

  release:
    runs-on: ubuntu-latest
    needs: [package, windows-claude-desktop-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: obs-agent-connector-package
          path: dist

      - name: Render release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/render-release-notes.sh dist/RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sh
            dist/*.ps1
            dist/*.txt
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
